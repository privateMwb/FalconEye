<svg width="1200" height="56" viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lg" x1="40" y1="0" x2="548" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rg" x1="652" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="1"/>
      <stop offset="55%" stop-color="#F5A623" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eye"><circle cx="600" cy="28" r="17"/></clipPath>
  </defs>

  <!-- soft halo behind the emblem -->
  <circle cx="600" cy="28" r="46" fill="url(#halo)"/>

  <!-- tick marks along each side -->
  <g stroke="#1F2A33" stroke-width="1"><line x1="60" y1="25" x2="60" y2="31"/><line x1="84" y1="25" x2="84" y2="31"/><line x1="108" y1="25" x2="108" y2="31"/><line x1="132" y1="25" x2="132" y2="31"/><line x1="156" y1="25" x2="156" y2="31"/><line x1="180" y1="25" x2="180" y2="31"/><line x1="204" y1="25" x2="204" y2="31"/><line x1="228" y1="25" x2="228" y2="31"/><line x1="252" y1="25" x2="252" y2="31"/><line x1="276" y1="25" x2="276" y2="31"/><line x1="300" y1="25" x2="300" y2="31"/><line x1="324" y1="25" x2="324" y2="31"/><line x1="348" y1="25" x2="348" y2="31"/><line x1="372" y1="25" x2="372" y2="31"/><line x1="396" y1="25" x2="396" y2="31"/><line x1="420" y1="25" x2="420" y2="31"/><line x1="444" y1="25" x2="444" y2="31"/><line x1="468" y1="25" x2="468" y2="31"/><line x1="492" y1="25" x2="492" y2="31"/><line x1="516" y1="25" x2="516" y2="31"/><line x1="540" y1="25" x2="540" y2="31"/></g>
  <g stroke="#1F2A33" stroke-width="1"><line x1="1140" y1="25" x2="1140" y2="31"/><line x1="1116" y1="25" x2="1116" y2="31"/><line x1="1092" y1="25" x2="1092" y2="31"/><line x1="1068" y1="25" x2="1068" y2="31"/><line x1="1044" y1="25" x2="1044" y2="31"/><line x1="1020" y1="25" x2="1020" y2="31"/><line x1="996" y1="25" x2="996" y2="31"/><line x1="972" y1="25" x2="972" y2="31"/><line x1="948" y1="25" x2="948" y2="31"/><line x1="924" y1="25" x2="924" y2="31"/><line x1="900" y1="25" x2="900" y2="31"/><line x1="876" y1="25" x2="876" y2="31"/><line x1="852" y1="25" x2="852" y2="31"/><line x1="828" y1="25" x2="828" y2="31"/><line x1="804" y1="25" x2="804" y2="31"/><line x1="780" y1="25" x2="780" y2="31"/><line x1="756" y1="25" x2="756" y2="31"/><line x1="732" y1="25" x2="732" y2="31"/><line x1="708" y1="25" x2="708" y2="31"/><line x1="684" y1="25" x2="684" y2="31"/><line x1="660" y1="25" x2="660" y2="31"/></g>

  <!-- faint baselines -->
  <path d="M40 28 H548" stroke="#1A1F26" stroke-width="1"/>
  <path d="M652 28 H1160" stroke="#1A1F26" stroke-width="1"/>

  <!-- request-trace lines with spikes -->
  <path d="M40 28 H168 L176 28 L182 12 L190 44 L196 20 L202 28 H330 L338 28 L342 22 L348 34 L352 28 H396 L404 28 L410 8 L418 48 L424 18 L430 28 H548" fill="none" stroke="url(#lg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1160 28 H1032 L1024 28 L1018 12 L1010 44 L1004 20 L998 28 H870 L862 28 L858 22 L852 34 L848 28 H804 L796 28 L790 8 L782 48 L776 18 L770 28 H652" fill="none" stroke="url(#rg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pulses travelling along the traces -->
  <circle r="3" fill="#5EEAD4" filter="url(#g)" opacity="0">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M40 28 H168 L176 28 L182 12 L190 44 L196 20 L202 28 H330 L338 28 L342 22 L348 34 L352 28 H396 L404 28 L410 8 L418 48 L424 18 L430 28 H548"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#F5A623" filter="url(#g)" opacity="0">
    <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M652 28 H1160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- the eye: rings, dashed orbit, radar sweep, pupil -->
  <circle cx="600" cy="28" r="21" fill="#0B0E11" stroke="#1F2A33" stroke-width="2"/>
  <circle cx="600" cy="28" r="21" fill="none" stroke="#5EEAD4" stroke-width="1.2" opacity="0.6">
    <animate attributeName="r" values="21;27" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="28" r="17" fill="none" stroke="#5EEAD4" stroke-width="1" stroke-dasharray="2 5" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 600 28" to="360 600 28" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="28" r="11" fill="none" stroke="#1F2A33" stroke-width="1"/>
  <g clip-path="url(#eye)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 600 28" to="360 600 28" dur="3.2s" repeatCount="indefinite"/>
      <path d="M600 28 L617 28 A17 17 0 0 0 612 16 Z" fill="url(#sw)"/>
      <path d="M600 28 L617 28" stroke="#5EEAD4" stroke-width="1.4"/>
    </g>
  </g>
  <circle cx="600" cy="28" r="4.2" fill="#0B0E11" stroke="#5EEAD4" stroke-width="1.6" filter="url(#g)"/>
  <circle cx="600" cy="28" r="1.6" fill="#5EEAD4">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- diamond end caps -->
  <path d="M30 28 l5 -5 l5 5 l-5 5 Z" fill="#5EEAD4" opacity="0.7"/>
  <path d="M1170 28 l-5 -5 l-5 5 l5 5 Z" fill="#F5A623" opacity="0.7"/>
</svg>
