# ============================================================
# .github/workflows/sanitizers.yml
# Boots falconeye_server under AddressSanitizer+
# UndefinedBehaviorSanitizer, and separately under
# ThreadSanitizer, then exercises a few real endpoints.
#
# This is a smoke test, not a sanitized test suite — server/
# has no tests/ directory yet (see build.yml's comment on the
# same gap), so there's nothing to run sanitized beyond booting
# the server and hitting it with real requests. Still
# meaningful: Metrics.h's ring buffer (std::mutex), atomic
# request counter, and thread_local breakdown pointer are all
# concurrency-sensitive code that ThreadSanitizer specifically
# is well-suited to catch issues in — more so than the ASan/
# UBSan pairing alone.
#
# ASan+UBSan can share one binary; ThreadSanitizer cannot be
# combined with ASan in the same build, hence two separate
# configure/build passes below.
# ============================================================

name: Sanitizers

on:
  push:
  pull_request:

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # See the tsan job's comment — fail fast and
                        # visibly rather than hang silently.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang curl

      - name: Configure
        working-directory: server
        env:
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        working-directory: server
        run: cmake --build build

      - name: Boot server and exercise real endpoints
        working-directory: server
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          ./build/falconeye_server > server.log 2>&1 &
          SERVER_PID=$!

          # Poll instead of a blind sleep — see the tsan job's comment.
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 localhost:8080/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}x2s polls"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server never became ready — dumping log:"
              cat server.log
              exit 1
            fi
            sleep 2
          done

          curl -sf --max-time 10 localhost:8080/api/health
          curl -sf --max-time 10 localhost:8080/api/todos/1
          curl -sf --max-time 10 localhost:8080/api/metrics
          curl -sf --max-time 10 localhost:8080/api/todos/999 || true # expected 404

          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID" || true

          cat server.log

          if grep -qE "ERROR: (AddressSanitizer|UndefinedBehaviorSanitizer)" server.log; then
            echo "Sanitizer reported an error — see log above."
            exit 1
          fi

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fail fast and visibly instead of silently consuming
                        # CI hours if the server hangs (real deadlock or
                        # unready-server + timeout-less curl) — this is
                        # what actually caught the ~1hr hang.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang curl

      - name: Configure
        working-directory: server
        env:
          CXX: clang++
          CXXFLAGS: -fsanitize=thread -fno-omit-frame-pointer -g -O1
          LDFLAGS: -fsanitize=thread
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        working-directory: server
        run: cmake --build build

      - name: Boot server and exercise real endpoints concurrently
        working-directory: server
        env:
          TSAN_OPTIONS: halt_on_error=0
        run: |
          ./build/falconeye_server > server.log 2>&1 &
          SERVER_PID=$!

          # TSan instrumentation is slow to boot — poll instead of a
          # blind sleep, so we don't fire requests before the server is
          # actually listening. Bounded to 60s so a server that never
          # comes up fails here, with a clear message, instead of every
          # curl below hanging indefinitely on a dead connection.
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 localhost:8080/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}x2s polls"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server never became ready — dumping log:"
              cat server.log
              exit 1
            fi
            sleep 2
          done

          # Reduced from 20 to 5 pairs: TSan's per-synchronization-event
          # overhead is substantial, and the thread pool here is sized
          # for 4 (see main.cpp) — 10 concurrent requests is still
          # enough real contention to exercise Metrics's mutex/atomic/
          # thread_local code without piling up 40 connections against
          # a 4-thread pool under the heaviest instrumentation we run.
          # Every curl below has --max-time so a genuinely stuck request
          # fails in seconds, not silently forever.
          for i in $(seq 1 5); do
            curl -sf --max-time 10 localhost:8080/api/todos/1 > /dev/null &
            curl -sf --max-time 10 localhost:8080/api/health > /dev/null &
          done
          wait
          curl -sf --max-time 10 localhost:8080/api/metrics > /dev/null

          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID" || true

          cat server.log

          if grep -q "WARNING: ThreadSanitizer" server.log; then
            echo "ThreadSanitizer reported a data race — see log above."
            exit 1
          fi
