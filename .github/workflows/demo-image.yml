# ============================================================
# .github/workflows/demo-image.yml
# Tests the hosted-demo front door, builds the hosted-demo image
# (Dockerfile.demo), and checks the running container from the
# outside with scripts/check-demo.sh: the server answers, the
# metrics grow, only the allowlisted routes get through, and CORS.
#
# This is the same check you can run against a deployed Render
# service, so a green run here means the image itself works.
# ============================================================

name: Demo image

on:
  push:
    paths:
      - "Dockerfile.demo"
      - ".dockerignore"
      - "render.yaml"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/demo-image.yml"
  pull_request:
    paths:
      - "Dockerfile.demo"
      - ".dockerignore"
      - "render.yaml"
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/demo-image.yml"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the front door
        run: node --test scripts/tests/*.test.mjs

      - name: Build the image
        run: docker build -f Dockerfile.demo -t falconeye-demo .

      - name: Start the container
        run: |
          docker run -d --name demo -p 10000:10000 \
            -e ALLOWED_ORIGINS=https://dashboard.example \
            falconeye-demo

      - name: Check it from outside
        run: scripts/check-demo.sh http://127.0.0.1:10000 https://dashboard.example

      # If the image failed to build, there is no container; say so instead of adding a
      # second, misleading error on top of the real one.
      - name: Container logs
        if: always()
        run: docker logs demo || echo "No container to show logs for (an earlier step failed)."

      - name: Stop the container
        if: always()
        run: docker rm -f demo || true
