# Render Blueprint for the hosted demo backend: one container that runs the real
# falconeye_server, a traffic generator, and a read-only front door on Render's single
# public port. The dashboard is deployed separately (Vercel); see docs/DEPLOYMENT.md.
services:
  - type: web
    name: falconeye-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    # "free" works but sleeps after a while without traffic; the first request afterwards
    # takes about a minute, and the metrics start from zero again.
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Your dashboard's exact origin, e.g. https://falconeye.vercel.app (comma-separate
      # several). Browsers on any other origin are refused. Set this in the Render dashboard.
      - key: ALLOWED_ORIGINS
        sync: false
